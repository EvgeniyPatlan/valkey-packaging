# Build and push the thin, multi-arch (amd64+arm64) Valkey module artifact
# images. Each module builds in parallel; buildx produces a manifest list and
# pushes it to Docker Hub. arm64 builds under QEMU emulation — fine here because
# the build only installs a prebuilt package (nothing is compiled). For faster
# builds, split into a native-runner matrix (ubuntu-latest + ubuntu-24.04-arm)
# and merge digests instead of emulating.
#
# Requires repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
name: module-images

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "valkey-91 repo channel"
        type: choice
        default: release
        options: [release, testing, experimental]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [json, bloom, search, ldap, audit]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }} (amd64+arm64)
        working-directory: docker
        run: make buildx-mod MODULE=${{ matrix.module }} REPO_CHANNEL=${{ inputs.channel }}
