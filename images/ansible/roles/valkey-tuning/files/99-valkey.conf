# The package ships /etc/sysctl.d/00-valkey.conf with overcommit_memory=1 and
# somaxconn=512. This file sorts later and therefore wins. overcommit is
# re-asserted deliberately so the image keeps its posture if the packaged
# defaults ever change; somaxconn is raised for the connection counts a
# dedicated instance is expected to handle.
vm.overcommit_memory = 1
net.core.somaxconn = 1024
